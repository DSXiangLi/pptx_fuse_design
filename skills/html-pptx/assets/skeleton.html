<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SLOT: 文档标题 --></title>
<style>
/* ============================================================
   SLOT: theme tokens
   从 references/themes.md 选定主题后，整套替换以下变量。
   禁止混搭、禁止修改色值。
   ============================================================ */
:root{
  /* 主题色（默认：墨水经典） */
  --paper:#f1efea;
  --paper-tint:#e8e5de;
  --ink:#0a0a0b;
  --ink-tint:#18181a;
  --accent:#0a0a0b;
  --accent-on:#f1efea;
  /* 字体栈（系统栈，离线可用） */
  --font-display:"Songti SC","Noto Serif SC","STSong",serif;
  --font-body:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-mono:"SF Mono","JetBrains Mono","Menlo",monospace;
  /* 画布内边距（画布坐标系 px） */
  --slide-pad:96px 120px;
}

/* ============================================================
   框架层 · 禁止修改
   处理：16:9 固定画布缩放、竖向滚动、键盘翻页、
   入场动效、reduced-motion 降级、打印。
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#111;
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
.deck{
  height:100vh;
  height:100dvh;
  overflow-y:auto;
  scroll-snap-type:y proximity;
}
.slide-slot{
  width:100%;
  height:calc(1080px * var(--slide-scale, .5));
  margin:12px 0;
  display:flex;
  justify-content:center;
  scroll-snap-align:start;
  content-visibility:auto;
}
.slide{
  width:1920px;
  height:1080px;
  flex:none;
  position:relative;
  overflow:hidden;
  transform:scale(var(--slide-scale, .5));
  transform-origin:top center;
  background:var(--paper);
  color:var(--ink);
  padding:var(--slide-pad);
}
/* 暗色页变体 */
.slide.dark{background:var(--ink);color:var(--paper)}

/* 入场动效：给元素加 class="reveal"，可用 style="--d:.15s" 做阶梯延迟 */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease;transition-delay:var(--d,0s)}
.slide.in-view .reveal{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){
  .reveal{opacity:1;transform:none;transition:none}
}

/* 界面 chrome：页码指示（在缩放画布之外） */
.deck-chrome{
  position:fixed;
  right:20px;
  bottom:16px;
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:.08em;
  color:#888;
  user-select:none;
  pointer-events:none;
  z-index:10;
}

/* 打印：每页一张 1920×1080（PDF 导出请用 Chrome/Edge） */
@media print{
  @page{size:1920px 1080px;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:none}
  .deck{height:auto;overflow:visible}
  .slide-slot{height:1080px;margin:0;page-break-after:always}
  .slide{transform:none !important}
  .deck-chrome{display:none}
  .reveal{opacity:1 !important;transform:none !important}
}
</style>
</head>
<body>

<div class="deck" id="deck">
  <!-- ==========================================================
       SLOT: slides
       每页结构（示例两页，生成时替换为真实内容）：
       - data-slide-id：稳定语义 ID，禁止用页码
       - data-editable：用户可见文字
       - data-editable-image：可替换图片，src 指向 assets/ 相对路径
       - data-editable-skip：纯装饰元素
       ========================================================== -->

  <div class="slide-slot">
    <section class="slide dark" data-slide-id="cover">
      <h1 data-editable style="font-family:var(--font-display);font-size:120px;line-height:1.3;font-weight:700">标题写在这里</h1>
      <p data-editable class="reveal" style="margin-top:32px;font-size:28px;opacity:.72">副标题 · 一句话说明这份幻灯片</p>
    </section>
  </div>

  <div class="slide-slot">
    <section class="slide" data-slide-id="example-content">
      <p data-editable-skip style="font-family:var(--font-mono);font-size:18px;letter-spacing:.12em;opacity:.55">01 · SECTION</p>
      <h2 data-editable class="reveal" style="margin-top:24px;font-size:72px;line-height:1.3">一页只讲一件事</h2>
      <p data-editable class="reveal" style="--d:.15s;margin-top:40px;font-size:24px;line-height:1.8;max-width:1200px">正文示例。图片用 <code>&lt;img data-editable-image src="assets/example.jpg"&gt;</code>，生成时放占位图。</p>
    </section>
  </div>

</div>

<!-- SLOT: 页码初始文本——生成时把 "1 / 1" 改为 "1 / N"（N=总页数） -->
<div class="deck-chrome" id="chrome">1 / 1</div>

<script>
/* ============================================================
   框架层 · 禁止修改
   ============================================================ */
(function(){
  var deck = document.getElementById('deck');
  var chrome = document.getElementById('chrome');

  function slots(){ return Array.prototype.slice.call(deck.querySelectorAll('.slide-slot')); }

  /* 缩放：整个 1920×1080 画布按容器比例缩放，绝不重排内容。
     ResizeObserver 而非 window resize：iframe 尺寸变化、侧栏开合都算。 */
  var lastScale = 0;
  function fit(){
    var s = Math.min(deck.clientWidth/1920, deck.clientHeight/1080);
    if (Math.abs(s - lastScale) < 0.001) return;  /* 去抖：dvh 抖动 */
    lastScale = s;
    document.documentElement.style.setProperty('--slide-scale', s);
  }
  if ('ResizeObserver' in window){ new ResizeObserver(fit).observe(deck); }
  window.addEventListener('resize', fit);
  fit();

  /* 页码指示 */
  function currentIndex(){
    var list = slots();
    var top = deck.scrollTop;
    for (var i = 0; i < list.length; i++){
      if (list[i].offsetTop + list[i].offsetHeight/2 > top + 8) return i;
    }
    return list.length - 1;
  }
  function updateChrome(){
    chrome.textContent = (currentIndex()+1) + ' / ' + slots().length;
  }
  deck.addEventListener('scroll', function(){ requestAnimationFrame(updateChrome); }, {passive:true});
  updateChrome();

  /* 键盘翻页 */
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function go(i){
    var list = slots();
    i = Math.max(0, Math.min(list.length-1, i));
    deck.scrollTo({top: list[i].offsetTop, behavior: reduceMotion ? 'auto' : 'smooth'});
  }
  window.addEventListener('keydown', function(e){
    if (e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA)$/.test(e.target.tagName))) return;
    if (e.key==='ArrowDown' || e.key==='PageDown' || e.key===' '){ e.preventDefault(); go(currentIndex()+1); }
    else if (e.key==='ArrowUp' || e.key==='PageUp'){ e.preventDefault(); go(currentIndex()-1); }
    else if (e.key==='Home'){ e.preventDefault(); go(0); }
    else if (e.key==='End'){ e.preventDefault(); go(slots().length-1); }
  });

  /* 入场动效：页面进入视口时触发 */
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) en.target.classList.add('in-view');
      });
    }, {root: deck, threshold: .35});
    slots().forEach(function(s){ io.observe(s.querySelector('.slide')); });
  } else {
    slots().forEach(function(s){ s.querySelector('.slide').classList.add('in-view'); });
  }
})();
</script>
</body>
</html>
