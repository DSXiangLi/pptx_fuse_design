<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>e2e harness</title>
<style>html,body{margin:0;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="ed" src="/editor.html"></iframe>
<div id="outside" style="position:fixed;right:0;bottom:0;width:80px;height:24px;background:#fff;z-index:9;font:11px monospace;display:flex;align-items:center;justify-content:center">outside</div>
<script>
/* 宿主侧：收集编辑器 postMessage 输出，提供注入入口 */
window.__inbox = [];
window.addEventListener('message', function(e){ window.__inbox.push(e.data); });
window.loadDeck = function(html, name, assetsUrl, exportManifest, exportBaseUrl){
  document.getElementById('ed').contentWindow.postMessage(
    { type: 'pptx-html:load', html: html, name: name, assetsUrl: assetsUrl,
      exportManifest: exportManifest, exportBaseUrl: exportBaseUrl }, location.origin);
};
window.exportIntents = function(){
  return window.__inbox.filter(function(m){ return m && m.type === 'pptx-html:export-intent'; });
};
window.saveCount = function(){
  return window.__inbox.filter(function(m){ return m && m.type === 'pptx-html:save'; }).length;
};
window.lastSave = function(){
  var saves = window.__inbox.filter(function(m){ return m && m.type === 'pptx-html:save'; });
  return saves.length ? saves[saves.length - 1] : null;
};
window.dirtyEvents = function(){
  return window.__inbox.filter(function(m){ return m && m.type === 'pptx-html:dirty'; })
    .map(function(m){ return m.dirty; });
};
</script>
</body>
</html>
