<svg xmlns="http://www.w3.org/2000/svg" width="640" height="384" viewBox="0 0 640 384">
  <rect width="640" height="384" fill="#e4e8ec"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#0a1f3d" opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="640" height="384" fill="url(#grid)"/>
  <!-- 全球分布的成员节点（抽象点阵大陆） -->
  <g fill="#0a1f3d">
    <circle cx="120" cy="110" r="5"/>
    <circle cx="150" cy="140" r="4"/>
    <circle cx="105" cy="170" r="4" opacity="0.8"/>
    <circle cx="170" cy="95" r="3.5" opacity="0.7"/>
    <circle cx="140" cy="250" r="4" opacity="0.75"/>
    <circle cx="300" cy="90" r="5"/>
    <circle cx="330" cy="120" r="4"/>
    <circle cx="285" cy="150" r="4" opacity="0.8"/>
    <circle cx="360" cy="200" r="4" opacity="0.75"/>
    <circle cx="320" cy="270" r="4" opacity="0.7"/>
    <circle cx="470" cy="110" r="5"/>
    <circle cx="500" cy="150" r="4"/>
    <circle cx="445" cy="170" r="3.5" opacity="0.8"/>
    <circle cx="530" cy="220" r="4" opacity="0.75"/>
    <circle cx="505" cy="290" r="4" opacity="0.7"/>
    <circle cx="210" cy="200" r="3.5" opacity="0.65"/>
    <circle cx="400" cy="130" r="3.5" opacity="0.65"/>
  </g>
  <!-- 异步协作的连线：跨时区而非同城 -->
  <g fill="none" stroke="#0a1f3d" stroke-width="1.2" opacity="0.45">
    <path d="M120 110 Q 210 40 300 90"/>
    <path d="M300 90 Q 390 50 470 110"/>
    <path d="M150 140 Q 240 220 360 200"/>
    <path d="M360 200 Q 450 260 530 220"/>
    <path d="M140 250 Q 230 300 320 270"/>
    <path d="M320 270 Q 415 320 505 290"/>
  </g>
</svg>
