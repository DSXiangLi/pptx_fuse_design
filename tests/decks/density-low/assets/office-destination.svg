<svg xmlns="http://www.w3.org/2000/svg" width="720" height="405" viewBox="0 0 720 405">
  <rect width="720" height="405" fill="#152a4a"/>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#f1f3f5" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="720" height="405" fill="url(#dots)"/>
  <!-- 平面功能分区：协作区 / 社交区 / 专注舱 -->
  <g fill="none" stroke="#f1f3f5" stroke-width="1.5" opacity="0.6">
    <rect x="56" y="48" width="300" height="200"/>
    <rect x="380" y="48" width="284" height="118"/>
    <rect x="380" y="190" width="132" height="166"/>
    <rect x="532" y="190" width="132" height="166"/>
    <line x1="56" y1="356" x2="664" y2="356"/>
  </g>
  <rect x="56" y="48" width="300" height="200" fill="#f1f3f5" opacity="0.10"/>
  <rect x="380" y="48" width="284" height="118" fill="#e4e8ec" opacity="0.16"/>
  <!-- 人：聚集在协作与社交区 -->
  <g fill="#f1f3f5">
    <circle cx="140" cy="130" r="7"/>
    <circle cx="206" cy="150" r="7" opacity="0.85"/>
    <circle cx="266" cy="118" r="7" opacity="0.7"/>
    <circle cx="470" cy="106" r="7"/>
    <circle cx="540" cy="96" r="7" opacity="0.8"/>
    <circle cx="606" cy="112" r="7" opacity="0.65"/>
    <circle cx="446" cy="272" r="6" opacity="0.5"/>
    <circle cx="598" cy="272" r="6" opacity="0.5"/>
  </g>
  <!-- 动线 -->
  <g fill="none" stroke="#f1f3f5" stroke-width="1" opacity="0.35" stroke-dasharray="2 6">
    <path d="M206 248 C 260 320, 420 320, 470 166"/>
    <path d="M356 148 C 368 140, 372 120, 380 108"/>
  </g>
</svg>
