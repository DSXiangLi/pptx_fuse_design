<svg xmlns="http://www.w3.org/2000/svg" width="640" height="760" viewBox="0 0 640 760">
  <rect width="640" height="760" fill="#e4e8ec"/>
  <!-- 楼层平面外框 -->
  <rect x="60" y="60" width="520" height="640" fill="#f1f3f5" stroke="#0a1f3d" stroke-width="2"/>
  <!-- 中央协作核心区 -->
  <rect x="200" y="240" width="240" height="240" fill="#0a1f3d"/>
  <circle cx="320" cy="360" r="52" fill="none" stroke="#f1f3f5" stroke-width="2"/>
  <circle cx="320" cy="360" r="8" fill="#f1f3f5"/>
  <!-- 周边工位点阵 -->
  <g fill="#152a4a">
    <circle cx="120" cy="130" r="7"/><circle cx="180" cy="130" r="7"/><circle cx="240" cy="130" r="7"/><circle cx="300" cy="130" r="7"/><circle cx="360" cy="130" r="7"/><circle cx="420" cy="130" r="7"/><circle cx="480" cy="130" r="7"/>
    <circle cx="120" cy="190" r="7"/><circle cx="180" cy="190" r="7"/><circle cx="420" cy="190" r="7"/><circle cx="480" cy="190" r="7"/>
    <circle cx="120" cy="300" r="7"/><circle cx="120" cy="360" r="7"/><circle cx="120" cy="420" r="7"/>
    <circle cx="480" cy="300" r="7"/><circle cx="480" cy="360" r="7"/><circle cx="480" cy="420" r="7"/>
    <circle cx="120" cy="560" r="7"/><circle cx="180" cy="560" r="7"/><circle cx="240" cy="560" r="7"/><circle cx="300" cy="560" r="7"/><circle cx="360" cy="560" r="7"/><circle cx="420" cy="560" r="7"/><circle cx="480" cy="560" r="7"/>
    <circle cx="120" cy="620" r="7"/><circle cx="180" cy="620" r="7"/><circle cx="420" cy="620" r="7"/><circle cx="480" cy="620" r="7"/>
  </g>
  <!-- 静音舱与会议室（细线分隔） -->
  <g stroke="#152a4a" stroke-width="1.5" fill="none">
    <rect x="90" y="500" width="110" height="150"/>
    <rect x="440" y="500" width="110" height="150"/>
    <line x1="60" y1="230" x2="200" y2="230"/>
    <line x1="440" y1="230" x2="580" y2="230"/>
    <line x1="60" y1="490" x2="200" y2="490"/>
    <line x1="440" y1="490" x2="580" y2="490"/>
  </g>
  <!-- 入口动线 -->
  <path d="M 320 700 L 320 480" stroke="#0a1f3d" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
  <rect x="280" y="700" width="80" height="6" fill="#0a1f3d"/>
</svg>
