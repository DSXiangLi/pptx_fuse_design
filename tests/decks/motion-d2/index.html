<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="skeleton-version" content="3">
<title>动效系统 v2 · 柔光暗房验收</title>
<style>
/* ============================================================
   SLOT: theme tokens
   从 references/themes.md 选定主题后，整套替换以下变量。
   禁止混搭、禁止修改色值。
   G3 质感主题（如 C2/D2/D3）会额外携带 --texture-type /
   --texture-layer / --texture-scope 三个 token，复制时一并带入。
   ============================================================ */
:root{
  /* 主题色（D2 柔光暗房） */
  --paper:#14110e;
  --paper-tint:#211b16;
  --ink:#f0e6d8;
  --ink-tint:#2c241d;
  --accent:#e8a34c;
  --accent-on:#14110e;
  /* 字体栈（系统栈，离线可用） */
  --font-display:"Songti SC","Noto Serif SC","STSong",serif;
  --font-body:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --font-mono:"SF Mono","JetBrains Mono","Menlo",monospace;
  /* 画布内边距（画布坐标系 px） */
  --slide-pad:96px 120px;
  /* G3 质感（D2 focus）：径向辉光，--texture-scope:cover 仅铺封面/章节页 */
  --texture-type: glow;
  --texture-layer: radial-gradient(120% 90% at 70% 10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%);
  --texture-scope: cover;
}

/* ============================================================
   框架层 · 禁止修改
   处理：16:9 固定画布缩放、竖向滚动、键盘翻页、
   入场动效（含运行时拆字引擎）、质感槽位、
   reduced-motion 降级、打印。
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#111;
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
.deck{
  height:100vh;
  height:100dvh;
  overflow-y:auto;
  scroll-snap-type:y proximity;
}
.slide-slot{
  width:100%;
  height:calc(1080px * var(--slide-scale, .5));
  margin:12px 0;
  display:flex;
  justify-content:center;
  scroll-snap-align:start;
  content-visibility:auto;
}
.slide{
  width:1920px;
  height:1080px;
  flex:none;
  position:relative;
  overflow:hidden;
  transform:scale(var(--slide-scale, .5));
  transform-origin:top center;
  background:var(--paper);
  color:var(--ink);
  padding:var(--slide-pad);
}
/* 暗色页变体 */
.slide.dark{background:var(--ink);color:var(--paper)}

/* 质感槽位（G3 texture，skeleton v3）：主题给 --texture-layer 时铺在页面
   背景之上、内容之下；主题不给则为 none，零成本。
   --texture-scope: cover 时骨架 JS 给 <html> 加 .texture-cover，
   仅 .cover-page（封面/章节页，由生成侧标注）铺质感层。 */
.slide::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:var(--texture-layer,none);
}
html.texture-cover .slide::before{background:none}
html.texture-cover .slide.cover-page::before{background:var(--texture-layer)}

/* 动效缓动 token（skeleton v3）：全 deck 只用这三种缓动，禁止逐页自定义。
   出 = 入场显影；变 = 变换/移动；环 = 循环 ambience。规则见 references/motion.md */
:root{
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-shift:cubic-bezier(.7,0,.2,1);
  --ease-loop:ease-in-out;
}

/* 入场动效：给元素加 class="reveal"，可用 style="--d:.15s" 做阶梯延迟。
   .js 门槛：无 JS 环境（打印预览器/抓取器）下内容直接可见，动效只是增强。 */
.js .reveal{opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease-out),transform .6s var(--ease-out);transition-delay:var(--d,0s)}
.js .slide.in-view .reveal{opacity:1;transform:none}

/* 语义动效：section[data-animate] 选配方，元素 [data-anim] 标角色。
   配方只调节奏与方向；框架 JS 在加载时为每个 [data-anim] 分配序号 --i。
   规则与词汇表见 references/motion.md。 */
.js [data-anim]{opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease-out),transform .6s var(--ease-out);transition-delay:calc(var(--i,0)*75ms)}
.js [data-anim="left"]{transform:translateX(-40px)}
.js [data-anim="right"]{transform:translateX(40px)}
.js [data-anim="line"]{transform:scaleX(0);transform-origin:left}
.js [data-animate="hero"] [data-anim]{transition-duration:1s;transition-delay:calc(var(--i,0)*160ms)}
.js [data-animate="quote"] [data-anim]{transition-duration:.55s;transition-delay:calc(var(--i,0)*220ms)}
.js .slide.in-view [data-anim]{opacity:1;transform:none}

/* ---- skeleton v3 recipe ---- */
/* chars/words/shatter：文件中是纯文本，框架 JS 入场时拆成 .sp-unit 序列、
   动画完成后还原为纯文本。容器只做快速整体淡入，逐字运动由 span 承担。 */
.js [data-anim="chars"],.js [data-anim="words"],.js [data-anim="shatter"]{transform:none;transition:opacity .3s ease}
.js .split-anim .sp-unit{display:inline-block;opacity:0;transform:translateY(.55em);transition:opacity .5s var(--ease-out),transform .55s var(--ease-out);transition-delay:calc(var(--j,0)*45ms)}
.js [data-anim="words"].split-anim .sp-unit{transition-delay:calc(var(--j,0)*90ms)}
.js [data-anim="shatter"].split-anim .sp-unit{transform:translate(var(--sx,0),var(--sy,1em)) rotate(var(--sr,0deg));transition-duration:.5s,.75s;transition-delay:calc(var(--j,0)*40ms)}
.js .slide.in-view .split-anim .sp-unit{opacity:1;transform:none}
/* count-up：数字滚动。保留整体淡入、去掉位移；数值滚动由框架 JS 驱动
   （读元素文本终值，从 0 或 data-from 起滚），文本始终是纯文本。 */
.js [data-anim="count-up"]{transform:none}
/* draw-line：SVG 描边描绘。框架 JS 加载时量长藏线，入场时归零描出。 */
.js [data-anim="draw-line"]{opacity:1;transform:none;transition:stroke-dashoffset 1.1s var(--ease-out);transition-delay:calc(var(--i,0)*75ms)}
/* fill-bar：横向填充（进度/占比/横条图）。 */
.js [data-anim="fill-bar"]{transform:scaleX(0);transform-origin:left center;transition:opacity .5s var(--ease-out),transform 1s var(--ease-out);transition-delay:calc(var(--i,0)*75ms)}

/* 背景 ambience：只允许背景层/水印/呼吸点，强度上限烧死在参数里
   （位移 ≤10px、不透明度摆幅 ≤.4、循环周期 ≥3s），不承载信息。 */
@keyframes amb-pulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes amb-drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(10px,-8px,0)}}
@keyframes amb-glow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.05)}}
.js .amb-pulse{animation:amb-pulse 4s var(--ease-loop) infinite}
.js .amb-drift{animation:amb-drift 9s var(--ease-loop) infinite}
.js .amb-glow{animation:amb-glow 6s var(--ease-loop) infinite}

@media (prefers-reduced-motion: reduce){
  .js .reveal,.js [data-anim]{opacity:1;transform:none;transition:none}
  .js .split-anim .sp-unit{opacity:1;transform:none;transition:none}
  .js .amb-pulse,.js .amb-drift,.js .amb-glow{animation:none}
}

/* 界面 chrome：页码指示（在缩放画布之外） */
.deck-chrome{
  position:fixed;
  right:20px;
  bottom:16px;
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:.08em;
  color:#888;
  user-select:none;
  pointer-events:none;
  z-index:10;
}

/* 打印：每页一张 1920×1080（PDF 导出请用 Chrome/Edge） */
@media print{
  @page{size:1920px 1080px;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:none}
  .deck{height:auto;overflow:visible}
  .slide-slot{height:1080px;margin:0;page-break-after:always}
  .slide{transform:none !important}
  .deck-chrome{display:none}
  .reveal,[data-anim]{opacity:1 !important;transform:none !important}
  .split-anim .sp-unit{opacity:1 !important;transform:none !important;transition:none !important}
  [data-anim="draw-line"]{stroke-dashoffset:0 !important}
}
</style>
</head>
<body>

<div class="deck" id="deck">

<!-- SLOT: 页码初始文本——生成时把 "1 / 1" 改为 "1 / N"（N=总页数） -->
<div class="deck-chrome" id="chrome">1 / 5</div>

<script>
/* ============================================================
   框架层 · 禁止修改
   ============================================================ */
(function(){
  document.documentElement.classList.add('js');  /* 动效 .js 门槛：无 JS 时内容直接可见 */
  var deck = document.getElementById('deck');
  var chrome = document.getElementById('chrome');

  function slots(){ return Array.prototype.slice.call(deck.querySelectorAll('.slide-slot')); }

  /* 缩放：整个 1920×1080 画布按容器比例缩放，绝不重排内容。
     ResizeObserver 而非 window resize：iframe 尺寸变化、侧栏开合都算。 */
  var lastScale = 0;
  function fit(){
    var s = Math.min(deck.clientWidth/1920, deck.clientHeight/1080);
    if (Math.abs(s - lastScale) < 0.001) return;  /* 去抖：dvh 抖动 */
    lastScale = s;
    document.documentElement.style.setProperty('--slide-scale', s);
  }
  if ('ResizeObserver' in window){ new ResizeObserver(fit).observe(deck); }
  window.addEventListener('resize', fit);
  fit();

  /* 页码指示 */
  function currentIndex(){
    var list = slots();
    var top = deck.scrollTop;
    for (var i = 0; i < list.length; i++){
      if (list[i].offsetTop + list[i].offsetHeight/2 > top + 8) return i;
    }
    return list.length - 1;
  }
  function updateChrome(){
    chrome.textContent = (currentIndex()+1) + ' / ' + slots().length;
  }
  deck.addEventListener('scroll', function(){ requestAnimationFrame(updateChrome); }, {passive:true});
  updateChrome();

  /* 键盘翻页 */
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function go(i){
    var list = slots();
    i = Math.max(0, Math.min(list.length-1, i));
    deck.scrollTo({top: list[i].offsetTop, behavior: reduceMotion ? 'auto' : 'smooth'});
  }
  window.addEventListener('keydown', function(e){
    if (e.target && (e.target.isContentEditable || /^(INPUT|TEXTAREA)$/.test(e.target.tagName))) return;
    if (e.key==='ArrowDown' || e.key==='PageDown' || e.key===' '){ e.preventDefault(); go(currentIndex()+1); }
    else if (e.key==='ArrowUp' || e.key==='PageUp'){ e.preventDefault(); go(currentIndex()-1); }
    else if (e.key==='Home'){ e.preventDefault(); go(0); }
    else if (e.key==='End'){ e.preventDefault(); go(slots().length-1); }
  });

  /* 质感槽位：--texture-scope: cover 时只有 .cover-page 铺质感层 */
  var scope = '';
  try { scope = getComputedStyle(document.documentElement).getPropertyValue('--texture-scope').trim(); } catch(e){}
  if (scope === 'cover') document.documentElement.classList.add('texture-cover');

  /* ============================================================
     运行时动效引擎（skeleton v3）
     chars/words/shatter：入场时把纯文本拆成 .sp-unit 序列执行动画，
     完成后还原为纯文本节点；count-up：读终值滚动后精确还原原文本；
     draw-line：量长藏线、入场描出。
     滚动回滚默认不重复触发（与 .in-view 一次性语义一致）。
     reduced-motion 下整组引擎不启动——文件里本来就是纯文本与完整图形。
     ============================================================ */
  var SPLIT_SEL = '[data-anim="chars"],[data-anim="words"],[data-anim="shatter"]';
  var live = [];   /* 进行中的运行时动效元素（强制还原用） */

  function track(el){ if (live.indexOf(el) < 0) live.push(el); }
  function untrack(el){ var i = live.indexOf(el); if (i >= 0) live.splice(i, 1); }

  /* 还原单个元素：终止进行中的动效，恢复纯文本 / 终值文本 */
  function restoreEl(el){
    if (el.__rt){
      clearTimeout(el.__rt.timer);
      if (el.__rt.raf) cancelAnimationFrame(el.__rt.raf);
      if (el.__rt.finalText != null) el.textContent = el.__rt.finalText;
      el.__rt = null;
    }
    /* 拆字残留兜底：塌缩为纯文本节点 */
    if (el.querySelector && el.querySelector('.sp-unit')) el.textContent = el.textContent;
    if (el.classList) el.classList.remove('split-anim');
    untrack(el);
  }

  /* 编辑器接口：进入编辑 / 序列化保存前调用（见 editing-contract.md） */
  window.__pptxMotion = {
    restore: restoreEl,
    restoreAll: function(){ live.slice().forEach(restoreEl); }
  };

  function splitEl(el){
    if (el.__rt) return;
    var mode = el.getAttribute('data-anim');
    var text = el.textContent;
    var units = [];
    if (mode === 'words'){
      text.split(/(\s+)/).forEach(function(p){
        if (p) units.push({ ws: /^\s+$/.test(p), t: p });
      });
    } else {
      Array.from(text).forEach(function(ch){
        units.push({ ws: /^\s$/.test(ch), t: ch });
      });
    }
    el.__rt = { finalText: text, timer: null, raf: 0 };
    track(el);
    el.textContent = '';
    var n = 0;
    units.forEach(function(u){
      if (u.ws){ el.appendChild(document.createTextNode(u.t)); return; }
      var s = document.createElement('span');
      s.className = 'sp-unit';
      s.style.setProperty('--j', n++);
      if (mode === 'shatter'){
        /* 碎聚：确定性伪随机散布（同一文本每次入场形态一致，不逐帧随机） */
        var seed = n * 137.5;
        s.style.setProperty('--sx', (Math.sin(seed) * 1.6).toFixed(2) + 'em');
        s.style.setProperty('--sy', (Math.cos(seed * 1.3) * 1.1).toFixed(2) + 'em');
        s.style.setProperty('--sr', (Math.sin(seed * 2.1) * 40).toFixed(1) + 'deg');
      }
      s.appendChild(document.createTextNode(u.t));
      el.appendChild(s);
    });
    el.classList.add('split-anim');
    /* 动画完成后还原为纯文本：stagger 步长 × 个数 + 单项时长 + 余量 */
    var step = mode === 'words' ? 90 : (mode === 'shatter' ? 40 : 45);
    var dur  = mode === 'shatter' ? 800 : 600;
    el.__rt.timer = setTimeout(function(){ restoreEl(el); }, n * step + dur + 250);
  }

  /* count-up：元素文本即终值（可含千分位/小数/前后缀），从 data-from 或 0 起滚 */
  function countUp(el){
    if (el.__rt) return;
    var finalText = el.textContent;
    var m = /-?[\d,]*\.?\d+/.exec(finalText);
    if (!m) return;
    var finalVal = parseFloat(m[0].replace(/,/g, ''));
    if (isNaN(finalVal)) return;
    var from = parseFloat(el.getAttribute('data-from'));
    if (isNaN(from)) from = 0;
    var decimals = (m[0].split('.')[1] || '').length;
    var grouped = m[0].indexOf(',') >= 0;
    function fmt(v){
      var s = grouped
        ? v.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals })
        : v.toFixed(decimals);
      return finalText.slice(0, m.index) + s + finalText.slice(m.index + m[0].length);
    }
    el.__rt = { finalText: finalText, timer: null, raf: 0 };
    track(el);
    var dur = 1400, t0 = null;
    el.textContent = fmt(from);
    function tick(t){
      if (!el.__rt) return;   /* 被强制还原 */
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);   /* easeOutCubic */
      el.textContent = fmt(from + (finalVal - from) * e);
      if (k < 1){ el.__rt.raf = requestAnimationFrame(tick); }
      else { el.textContent = finalText; el.__rt = null; untrack(el); }   /* 终值精确还原原文本 */
    }
    el.__rt.raf = requestAnimationFrame(tick);
  }

  /* draw-line：加载时量长藏线（stroke-dashoffset=length），入场时归零描出。
     量长失败（非几何元素）时退回整体淡入。 */
  function prepDrawLine(el){
    var len = 0;
    try { len = el.getTotalLength(); } catch(e){}
    if (!len) return;
    el.__drawLen = len;
    el.style.strokeDasharray = String(len);
    el.style.strokeDashoffset = String(len);
  }

  /* 入场动效：页面进入视口时触发（一次性，回滚不重复） */
  /* 加载时为每页的 [data-anim] 元素分配序号 --i（阶梯延迟的基数） */
  slots().forEach(function(s){
    var els = s.querySelectorAll('[data-anim]');
    for (var i = 0; i < els.length; i++) els[i].style.setProperty('--i', i);
  });
  if (!reduceMotion){
    slots().forEach(function(s){
      var lines = s.querySelectorAll('[data-anim="draw-line"]');
      for (var i = 0; i < lines.length; i++) prepDrawLine(lines[i]);
    });
  }
  function enterSlide(slide){
    if (slide.classList.contains('in-view')) return;
    if (!reduceMotion){
      /* 运行时拆字：先拆再加 in-view（同一帧完成，避免先显后拆的闪烁） */
      var splits = slide.querySelectorAll(SPLIT_SEL);
      for (var i = 0; i < splits.length; i++) splitEl(splits[i]);
    }
    slide.classList.add('in-view');
    if (!reduceMotion){
      var cus = slide.querySelectorAll('[data-anim="count-up"]');
      for (var j = 0; j < cus.length; j++) countUp(cus[j]);
      var dls = slide.querySelectorAll('[data-anim="draw-line"]');
      for (var k = 0; k < dls.length; k++){
        if (dls[k].__drawLen) dls[k].style.strokeDashoffset = '0';
      }
    }
  }
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting) enterSlide(en.target);
      });
    }, {root: deck, threshold: .35});
    slots().forEach(function(s){ io.observe(s.querySelector('.slide')); });
  } else {
    slots().forEach(function(s){ enterSlide(s.querySelector('.slide')); });
  }
})();
</script>
</body>
</html>
