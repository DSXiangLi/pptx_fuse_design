<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640">
  <rect width="880" height="640" fill="#e8e5de"/>
  <!-- 淡网格 -->
  <g stroke="#0a0a0b" stroke-opacity="0.06" stroke-width="1">
    <line x1="110" y1="0" x2="110" y2="640"/>
    <line x1="220" y1="0" x2="220" y2="640"/>
    <line x1="330" y1="0" x2="330" y2="640"/>
    <line x1="440" y1="0" x2="440" y2="640"/>
    <line x1="550" y1="0" x2="550" y2="640"/>
    <line x1="660" y1="0" x2="660" y2="640"/>
    <line x1="770" y1="0" x2="770" y2="640"/>
  </g>
  <!-- 光晕 -->
  <circle cx="440" cy="300" r="228" fill="none" stroke="#0a0a0b" stroke-opacity="0.12" stroke-width="40"/>
  <circle cx="440" cy="300" r="228" fill="none" stroke="#0a0a0b" stroke-opacity="0.35" stroke-width="10"/>
  <!-- 环形灯体 -->
  <circle cx="440" cy="300" r="168" fill="none" stroke="#0a0a0b" stroke-width="34"/>
  <circle cx="440" cy="300" r="168" fill="none" stroke="#f1efea" stroke-opacity="0.5" stroke-width="4"/>
  <!-- 15° 倾角投光线 -->
  <line x1="440" y1="468" x2="290" y2="580" stroke="#0a0a0b" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="440" y1="468" x2="590" y2="580" stroke="#0a0a0b" stroke-opacity="0.5" stroke-width="2"/>
  <line x1="290" y1="580" x2="590" y2="580" stroke="#0a0a0b" stroke-width="3"/>
  <!-- 底座支点 -->
  <circle cx="440" cy="580" r="7" fill="#0a0a0b"/>
</svg>
